<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Runner</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #1a0033; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
        }
        #uiLayer { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #00ffff;
            font-size: 36px;
            font-weight: 900;
            text-shadow: 0 0 15px #00ffff, 0 0 5px #fff;
            display: none;
        }
        .menu { 
            background: rgba(20, 0, 40, 0.9); 
            padding: 50px; 
            border-radius: 20px; 
            border: 4px solid #ff00ff;
            text-align: center; 
            color: white; 
            pointer-events: auto; 
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.3);
        }
        h1 { 
            margin-top: 0; 
            color: #fff; 
            font-size: 54px; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-shadow: 0 0 20px #ff00ff, 0 0 10px #ff00ff;
        }
        p { font-size: 20px; color: #ddd; line-height: 1.6; font-weight: bold; }
        .highlight { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        .collect { color: #ffff00; text-shadow: 0 0 10px #ffff00; }
        button { 
            background: linear-gradient(45deg, #00ffff, #0088ff); 
            color: #fff; 
            border: none; 
            padding: 15px 50px; 
            font-size: 24px; 
            border-radius: 50px; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-weight: 900; 
            margin-top: 20px;
            box-shadow: 0 0 20px #00ffff;
            transition: all 0.2s;
        }
        button:hover { 
            background: linear-gradient(45deg, #fff, #00ffff); 
            color: #000;
            box-shadow: 0 0 30px #fff; 
            transform: scale(1.1); 
        }
        #loadingText {
            color: #ffff00;
            font-size: 24px;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="hud">SCORE: <span id="scoreValue">0</span></div>

    <div id="uiLayer">
        <div id="startMenu" class="menu">
            <h1>Neon Runner</h1>
            <div id="loadingText">Connecting to GitHub Models...</div>
            <p>
                <b>Left/Right Arrows</b> to change lanes.<br>
                <b>Up Arrow</b> to Jump.<br>
                <b>Spacebar</b> to Shoot Lasers!
            </p>
            <p>Dodge the <span class="highlight">Obstacles</span>!<br>Collect <span class="collect">Gold Stars</span>.</p>
            <button id="startBtn" style="display: none;">Blast Off!</button>
        </div>

        <div id="gameOverMenu" class="menu hidden">
            <h1 style="color: #ff0055; text-shadow: 0 0 20px #ff0000;">CRASH!</h1>
            <p>Final Score: <span id="finalScore" style="color: #ffff00; font-size: 32px; font-weight: bold;">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // --- GAME STATE & CONSTANTS ---
        let gameState = 'LOADING'; 
        const LANE_X = [-4, 0, 4]; 
        let currentLane = 1; 
        let score = 0;
        let gameSpeed = 50;
        let speedMultiplier = 1;

        const PATH = 'SpaceShip%20Images/'; 

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0033); 
        scene.fog = new THREE.FogExp2(0x1a0033, 0.012); 

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 6, 14);
        camera.lookAt(0, 0, -20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- UPGRADED LIGHTING FOR .GLB MODELS ---
        // 1. A strong ambient light so the dark parts of the 3D models are visible
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); 
        scene.add(ambientLight);

        // 2. The neon colors for the environment
        const hemiLight = new THREE.HemisphereLight(0xff00ff, 0x00ffff, 0.8); 
        scene.add(hemiLight);
        
        // 3. A strong directional light to cast shiny reflections
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- ENVIRONMENT ---
        const gridHelper = new THREE.GridHelper(200, 100, 0xff00ff, 0x00ffff);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        const starGeo = new THREE.BufferGeometry();
        const starCount = 600;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i < starCount * 3; i+=3) {
            starPos[i] = (Math.random() - 0.5) * 100; 
            starPos[i+1] = Math.random() * 50;       
            starPos[i+2] = (Math.random() - 0.5) * 200; 
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- ASSET MANAGEMENT ---
        const gltfLoader = new THREE.GLTFLoader();
        const loadedPlayers = [];
        const loadedEnemies = [];
        
        const playerFiles = ['astronautA.glb', 'astronautB.glb'];
        const enemyFiles = ['alien.glb', 'barrel.glb'];

        const manager = new THREE.LoadingManager();
        manager.onLoad = function () {
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('startBtn').style.display = 'block';
            gameState = 'MENU';
            buildPlayerAndTail(); 
        };
        manager.onError = function (url) {
            console.error('Error loading:', url);
            document.getElementById('loadingText').innerText = "File not found! Check spelling in code.";
        };

        gltfLoader.manager = manager;

        // Load all Player characters
        playerFiles.forEach(file => {
            gltfLoader.load(PATH + file, function(gltf) {
                const model = gltf.scene;
                
                // Hack the materials to make sure they aren't black
                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material.metalness = 0.1; // Make it less metallic so it reflects better
                        child.material.roughness = 0.5; 
                        // Add a slight self-glow based on its own color
                        child.material.emissive = child.material.color || new THREE.Color(0x000000);
                        child.material.emissiveIntensity = 0.2; 
                    }
                });

                // Made the astronauts BIGGER (was 1.5, now 3.5)
                model.scale.set(3.5, 3.5, 3.5); 
                model.rotation.y = Math.PI; 
                loadedPlayers.push(model);
            });
        });

        // Load all Enemy characters
        enemyFiles.forEach(file => {
            gltfLoader.load(PATH + file, function(gltf) {
                const model = gltf.scene;

                // Fix materials for enemies too
                model.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material.metalness = 0.1;
                        child.material.roughness = 0.5;
                        child.material.emissive = child.material.color || new THREE.Color(0x000000);
                        child.material.emissiveIntensity = 0.2;
                    }
                });

                // Made the enemies BIGGER (was 2, now 4)
                model.scale.set(4, 4, 4); 
                loadedEnemies.push(model);
            });
        });

        // --- GAME ENTITIES ---
        let playerGroup = new THREE.Group();
        const tailCount = 2; 
        const tails = [];
        const playerHistory = []; 

        function buildPlayerAndTail() {
            if(loadedPlayers.length > 0) {
                playerGroup.add(loadedPlayers[0].clone());
            }
            playerGroup.position.set(LANE_X[currentLane], 1.5, 0);
            scene.add(playerGroup);

            for(let i=0; i<tailCount; i++) {
                if(loadedPlayers.length > 0) {
                    const tailGroup = new THREE.Group();
                    const modelIndex = (i + 1) % loadedPlayers.length; 
                    const clonedModel = loadedPlayers[modelIndex].clone();
                    
                    // Make tails a bit smaller than the main player
                    clonedModel.scale.set(2.5, 2.5, 2.5); 

                    tailGroup.add(clonedModel);
                    tailGroup.position.set(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z + (i+1)*3);
                    scene.add(tailGroup);
                    tails.push(tailGroup);
                }
            }
        }

        // Physics & Pools
        let playerVelocityY = 0;
        let isJumping = false;
        const GRAVITY = -70;
        const JUMP_FORCE = 30;

        let enemies = [];
        let collectibles = [];
        let projectiles = [];
        let explosionParticles = []; 

        // Glowing Gold Star
        const collectGeo = new THREE.OctahedronGeometry(1.2, 0);
        const collectMat = new THREE.MeshLambertMaterial({ color: 0xffff00, emissive: 0xaa8800 });
        // Laser Projectile
        const projectileGeo = new THREE.CylinderGeometry(0.15, 0.15, 8, 8);
        projectileGeo.rotateX(Math.PI / 2); 
        const projectileMat = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 

        // --- INPUT HANDLING ---
        window.addEventListener('keydown', (e) => {
            if (gameState !== 'PLAYING') return;
            if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) {
                currentLane--;
            } else if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) {
                currentLane++;
            } else if ((e.key === 'ArrowUp' || e.key === 'w') && !isJumping) {
                isJumping = true;
                playerVelocityY = JUMP_FORCE;
            } else if (e.key === ' ') {
                spawnProjectile();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- GAME LOGIC FUNCTIONS ---
        function spawnProjectile() {
            const mesh = new THREE.Mesh(projectileGeo, projectileMat);
            mesh.position.set(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z - 2);
            scene.add(mesh);
            projectiles.push(mesh);
        }

        function createExplosion(x, y, z, colorHex) {
            const particleCount = 20;
            const geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            for (let i = 0; i < particleCount; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 50,
                    (Math.random() - 0.5) * 50,
                    (Math.random() - 0.5) * 50
                );
                mesh.life = 1.0; 
                scene.add(mesh);
                explosionParticles.push(mesh);
            }
        }

        function spawnObject(type) {
            const laneIndex = Math.floor(Math.random() * 3);
            const xPos = LANE_X[laneIndex];
            const zPos = -200; 

            if (type === 'ENEMY') {
                if(loadedEnemies.length > 0) {
                    const randomEnemy = loadedEnemies[Math.floor(Math.random() * loadedEnemies.length)];
                    const mesh = randomEnemy.clone();
                    mesh.position.set(xPos, 1.5, zPos);
                    
                    mesh.userData = {
                        rotX: (Math.random() - 0.5) * 2,
                        rotY: (Math.random() - 0.5) * 2
                    };
                    
                    scene.add(mesh);
                    enemies.push(mesh);
                }
            } else if (type === 'COLLECTIBLE') {
                const mesh = new THREE.Mesh(collectGeo, collectMat);
                mesh.position.set(xPos, 1.5, zPos);
                scene.add(mesh);
                collectibles.push(mesh);
            }
        }

        function resetGame() {
            enemies.forEach(e => scene.remove(e));
            collectibles.forEach(c => scene.remove(c));
            projectiles.forEach(p => scene.remove(p));
            explosionParticles.forEach(p => scene.remove(p));
            enemies = [];
            collectibles = [];
            projectiles = [];
            explosionParticles = [];
            playerHistory.length = 0;

            currentLane = 1;
            playerGroup.position.set(LANE_X[currentLane], 1.5, 0);
            playerVelocityY = 0;
            isJumping = false;
            score = 0;
            speedMultiplier = 1;
            document.getElementById('scoreValue').innerText = score;

            tails.forEach((t, i) => {
                t.position.set(playerGroup.position.x, playerGroup.position.y, (i+1)*4); // Spaced out more
            });

            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            document.getElementById('hud').style.display = 'block';

            gameState = 'PLAYING';
        }

        function checkCollisions() {
            const playerBox = new THREE.Box3().setFromObject(playerGroup);
            playerBox.expandByScalar(-0.8); // Shrunk hitbox further to make dodging fair

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemyBox = new THREE.Box3().setFromObject(enemies[i]);
                enemyBox.expandByScalar(-0.4); 

                if (playerBox.intersectsBox(enemyBox)) {
                    createExplosion(playerGroup.position.x, playerGroup.position.y, playerGroup.position.z, 0x00ffff);
                    triggerGameOver();
                    return;
                }
                
                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const projectileBox = new THREE.Box3().setFromObject(projectiles[j]);
                    if (projectileBox.intersectsBox(enemyBox)) {
                        score += 50;
                        document.getElementById('scoreValue').innerText = score;
                        createExplosion(enemies[i].position.x, enemies[i].position.y, enemies[i].position.z, 0xff0055);
                        scene.remove(enemies[i]);
                        enemies.splice(i, 1);
                        scene.remove(projectiles[j]);
                        projectiles.splice(j, 1);
                        break; 
                    }
                }
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                const collectBox = new THREE.Box3().setFromObject(collectibles[i]);
                if (playerBox.intersectsBox(collectBox)) {
                    score += 100;
                    document.getElementById('scoreValue').innerText = score;
                    createExplosion(collectibles[i].position.x, collectibles[i].position.y, collectibles[i].position.z, 0xffff00);
                    scene.remove(collectibles[i]);
                    collectibles.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            gameState = 'GAME_OVER';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('gameOverMenu').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        document.getElementById('startBtn').addEventListener('click', resetGame);
        document.getElementById('restartBtn').addEventListener('click', resetGame);

        // --- MAIN UPDATE LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (delta > 0.1) return; 

            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                let p = explosionParticles[i];
                p.position.addScaledVector(p.velocity, delta); 
                p.life -= delta * 2; 
                p.scale.setScalar(Math.max(0, p.life)); 
                if (p.life <= 0) {
                    scene.remove(p);
                    explosionParticles.splice(i, 1);
                }
            }

            if (gameState === 'PLAYING') {
                const targetX = LANE_X[currentLane];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 15 * delta;
                playerGroup.rotation.z = (playerGroup.position.x - targetX) * -0.15; 

                if (isJumping) {
                    playerGroup.position.y += playerVelocityY * delta;
                    playerVelocityY += GRAVITY * delta;
                    if (playerGroup.position.y <= 1.5) {
                        playerGroup.position.y = 1.5;
                        isJumping = false;
                        playerVelocityY = 0;
                    }
                }

                playerHistory.unshift({ x: playerGroup.position.x, y: playerGroup.position.y });
                if (playerHistory.length > 50) playerHistory.pop(); 

                tails.forEach((tail, index) => {
                    const historyIndex = (index + 1) * 6; 
                    if (playerHistory[historyIndex]) {
                        tail.position.x = playerHistory[historyIndex].x;
                        tail.position.y = playerHistory[historyIndex].y;
                        tail.rotation.z = (tail.position.x - LANE_X[currentLane]) * -0.15;
                    }
                });

                const currentSpeed = gameSpeed * speedMultiplier;
                
                gridHelper.position.z += currentSpeed * delta;
                if (gridHelper.position.z > 10) gridHelper.position.z = 0;

                const positions = stars.geometry.attributes.position.array;
                for(let i=2; i < starCount * 3; i+=3) {
                    positions[i] += (currentSpeed * 1.5) * delta;
                    if(positions[i] > 20) positions[i] = -200; 
                }
                stars.geometry.attributes.position.needsUpdate = true;

                for (let i = projectiles.length - 1; i >= 0; i--) {
                    projectiles[i].position.z -= (currentSpeed * 4) * delta; 
                    if (projectiles[i].position.z < -200) {
                        scene.remove(projectiles[i]);
                        projectiles.splice(i, 1);
                    }
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    enemies[i].position.z += currentSpeed * delta;
                    enemies[i].rotation.x += enemies[i].userData.rotX * delta;
                    enemies[i].rotation.y += enemies[i].userData.rotY * delta;
                    
                    if (enemies[i].position.z > 10) {
                        scene.remove(enemies[i]);
                        enemies.splice(i, 1);
                        score += 10; 
                        document.getElementById('scoreValue').innerText = score;
                    }
                }

                for (let i = collectibles.length - 1; i >= 0; i--) {
                    collectibles[i].position.z += currentSpeed * delta;
                    collectibles[i].rotation.x += 2 * delta;
                    collectibles[i].rotation.y += 4 * delta;
                    if (collectibles[i].position.z > 10) {
                        scene.remove(collectibles[i]);
                        collectibles.splice(i, 1);
                    }
                }

                if (Math.random() < 0.04 + (speedMultiplier * 0.005)) spawnObject('ENEMY');
                if (Math.random() < 0.03) spawnObject('COLLECTIBLE');

                checkCollisions();
                speedMultiplier += 0.01 * delta;
            }

            // Bobbing animation for the menu
            if (gameState === 'MENU' && playerGroup.position) {
                playerGroup.position.y = 1.5 + Math.sin(Date.now() * 0.003) * 0.3;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
