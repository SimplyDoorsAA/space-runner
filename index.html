<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Jump!</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #6185f8; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
        }
        #uiLayer { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #ffffff;
            font-size: 40px;
            font-weight: 900;
            text-shadow: 3px 3px 0 #000;
            display: none;
        }
        .menu { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px 60px; 
            border-radius: 15px; 
            border: 4px solid #333;
            text-align: center; 
            color: #333; 
            pointer-events: auto; 
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
        }
        h1 { 
            margin-top: 0; 
            color: #ff3366; 
            font-size: 60px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-shadow: 3px 3px 0 #333;
        }
        p { font-size: 22px; color: #444; line-height: 1.6; font-weight: bold; }
        .highlight { color: #ff3366; }
        .collect { color: #f2a900; }
        button { 
            background: #ffcc00; 
            color: #333; 
            border: 3px solid #333; 
            padding: 15px 50px; 
            font-size: 28px; 
            border-radius: 10px; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-weight: 900; 
            margin-top: 20px;
            box-shadow: 4px 4px 0 #333;
            transition: all 0.1s;
        }
        button:active { 
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0 #333;
        }
        #loadingText {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
            font-weight: bold;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="hud">SCORE: <span id="scoreValue">0</span></div>

    <div id="uiLayer">
        <div id="startMenu" class="menu">
            <h1>Astro Jump!</h1>
            <div id="loadingText">Downloading 3D Assets...</div>
            <p>
                <b>Left/Right Arrows</b> to Run.<br>
                <b>Up Arrow</b> to Jump.<br>
            </p>
            <p>Stomp the <span class="highlight">Aliens</span> for loot!<br>Jump over the <span class="collect">Barrels</span>.</p>
            <button id="startBtn" style="display: none;">Let's Go!</button>
        </div>

        <div id="gameOverMenu" class="menu hidden">
            <h1 style="color: #ff3366;">OUCH!</h1>
            <p>Final Score: <span id="finalScore" style="color: #f2a900; font-size: 40px; font-weight: bold; text-shadow: 2px 2px 0 #333;">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // --- GAME STATE & CONSTANTS ---
        let gameState = 'LOADING'; 
        let score = 0;
        
        const GRAVITY = -85;
        const JUMP_FORCE = 32;
        const MOVE_SPEED = 18;
        const GROUND_Y = 1.0; 

        let playerVelY = 0;
        let playerVelX = 0;
        let isJumping = false;

        // OPTIMIZATION: Removed the %20, browser handles literal spaces better natively.
        const PATH = 'SpaceShip Images/'; 
        const keys = { right: false, left: false, up: false };

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x6185f8); 
        scene.fog = new THREE.Fog(0x6185f8, 20, 70);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 6, 16); 
        camera.lookAt(0, 3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 20, 15);
        dirLight.castShadow = true; 
        
        // OPTIMIZATION: Increased shadow resolution for crisp shadows
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        
        // Ensure the light reaches far enough to cast shadows
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;

        scene.add(dirLight);
        // CRITICAL BUG FIX: The target must be added to the scene for the light to track it!
        scene.add(dirLight.target); 

        // --- ENVIRONMENT ---
        const groundGeo = new THREE.BoxGeometry(2000, 10, 10);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x55cc55 }); 
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.set(500, -4.0, 0); 
        ground.receiveShadow = true; 
        scene.add(ground);

        const hillGeo = new THREE.SphereGeometry(15, 32, 16);
        const hillMat = new THREE.MeshLambertMaterial({ color: 0x3cb371 });
        for(let i=0; i<20; i++) {
            const hill = new THREE.Mesh(hillGeo, hillMat);
            hill.position.set(-50 + (i * 30), -5, -15);
            scene.add(hill);
        }

        // --- ASSET MANAGEMENT ---
        const gltfLoader = new THREE.GLTFLoader();
        let playerModel = null;
        let alienModel = null;
        let barrelModel = null;

        const manager = new THREE.LoadingManager();
        manager.onLoad = function () {
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('startBtn').style.display = 'block';
            gameState = 'MENU';
            buildLevel(); 
        };
        manager.onError = function (url) {
            console.error('Error loading:', url);
            document.getElementById('loadingText').innerText = "Asset Error. Using Fallbacks.";
            // If it fails, start anyway with fallback blocks
            document.getElementById('startBtn').style.display = 'block';
            gameState = 'MENU';
            buildLevel(); 
        };

        gltfLoader.manager = manager;

        function setupModel(model, scale) {
            model.scale.set(scale, scale, scale);
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true; 
                    child.receiveShadow = true;
                }
            });
            return model;
        }

        // Load Models
        gltfLoader.load(PATH + 'astronautA.glb', (gltf) => {
            playerModel = setupModel(gltf.scene, 2.5);
            playerModel.rotation.y = Math.PI / 2; 
        });

        gltfLoader.load(PATH + 'alien.glb', (gltf) => {
            alienModel = setupModel(gltf.scene, 2.5);
            alienModel.rotation.y = -Math.PI / 2; 
        });

        gltfLoader.load(PATH + 'barrel.glb', (gltf) => {
            barrelModel = setupModel(gltf.scene, 2.5);
        });

        // --- GAME ENTITIES ---
        let playerGroup = new THREE.Group();
        let enemies = [];
        let obstacles = [];
        let particles = [];
        let coins = []; 

        function buildLevel() {
            // SAFETY FALLBACK: If GitHub fails to load the model, make a blue box
            if(playerModel) {
                playerGroup.add(playerModel.clone());
            } else {
                const fallbackGeo = new THREE.BoxGeometry(1.5, 2.5, 1.5);
                const fallbackMat = new THREE.MeshLambertMaterial({color: 0x00aaff});
                const fallbackMesh = new THREE.Mesh(fallbackGeo, fallbackMat);
                fallbackMesh.castShadow = true;
                fallbackMesh.position.y = 1.25;
                playerGroup.add(fallbackMesh);
            }
            
            playerGroup.position.set(0, GROUND_Y, 0);
            scene.add(playerGroup);
            generateCourse();
        }

        function generateCourse() {
            let currentX = 25; 
            for(let i=0; i < 80; i++) { 
                currentX += 12 + Math.random() * 15; 
                const rand = Math.random();
                
                if (rand < 0.5) {
                    let mesh;
                    if (alienModel) {
                        mesh = alienModel.clone();
                    } else {
                        // Fallback Red Box
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 1.5), new THREE.MeshLambertMaterial({color: 0xff0055}));
                        mesh.castShadow = true;
                        mesh.position.y = 1.0;
                    }
                    mesh.position.set(currentX, GROUND_Y, 0);
                    scene.add(mesh);
                    enemies.push({ mesh: mesh, active: true });
                } else {
                    let mesh;
                    if (barrelModel) {
                        mesh = barrelModel.clone();
                    } else {
                        // Fallback Orange Box
                        mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshLambertMaterial({color: 0xff8800}));
                        mesh.castShadow = true;
                        mesh.position.y = 1.0;
                    }
                    mesh.position.set(currentX, GROUND_Y, 0);
                    scene.add(mesh);
                    obstacles.push({ mesh: mesh, active: true });
                }
            }
        }

        // --- EFFECTS ---
        const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
        coinGeo.rotateX(Math.PI / 2);
        const coinMat = new THREE.MeshLambertMaterial({ color: 0xffdd00 });

        function createLootExplosion(x, y, z) {
            for (let i = 0; i < 5; i++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.position.set(x, y, z);
                coin.castShadow = true;
                coin.velocity = new THREE.Vector3((Math.random() - 0.5) * 10, Math.random() * 15 + 10, (Math.random() - 0.5) * 5);
                coin.life = 2.0; 
                scene.add(coin);
                coins.push(coin);
            }
        }

        function createDustPoof(x, y, z) {
            const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            for (let i = 0; i < 6; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x + (Math.random()-0.5), y, z);
                mesh.velocity = new THREE.Vector3((Math.random()-0.5)*5, Math.random()*5, 0);
                mesh.life = 0.5; 
                scene.add(mesh);
                particles.push(mesh);
            }
        }

        // --- INPUT HANDLING ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                if (!isJumping && gameState === 'PLAYING') {
                    playerVelY = JUMP_FORCE;
                    isJumping = true;
                    createDustPoof(playerGroup.position.x, GROUND_Y, playerGroup.position.z);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- GAME LOGIC ---
        function resetGame() {
            enemies.forEach(e => scene.remove(e.mesh));
            obstacles.forEach(o => scene.remove(o.mesh));
            particles.forEach(p => scene.remove(p));
            coins.forEach(c => scene.remove(c));
            
            enemies = [];
            obstacles = [];
            particles = [];
            coins = [];

            playerGroup.position.set(0, GROUND_Y, 0);
            playerVelY = 0;
            isJumping = false;
            keys.right = false;
            keys.left = false;
            
            score = 0;
            document.getElementById('scoreValue').innerText = score;

            generateCourse();

            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            document.getElementById('hud').style.display = 'block';

            gameState = 'PLAYING';
        }

        function checkCollisions() {
            // OPTIMIZATION: Switched to Distance-based checking instead of heavy Bounding Boxes
            const pX = playerGroup.position.x;
            const pY = playerGroup.position.y;

            // Check Aliens
            for (let i = 0; i < enemies.length; i++) {
                if (!enemies[i].active) continue;
                
                const eX = enemies[i].mesh.position.x;
                const eY = enemies[i].mesh.position.y;
                
                // Fast distance check (Pythagorean theorem basically)
                const dist = Math.sqrt((pX - eX)**2 + (pY - eY)**2);

                if (dist < 2.0) { // Collision radius
                    if (playerVelY < 0 && pY > eY + 0.8) {
                        // Stomp!
                        enemies[i].active = false;
                        scene.remove(enemies[i].mesh);
                        createLootExplosion(eX, eY + 1, 0);
                        playerVelY = JUMP_FORCE * 0.7; 
                        isJumping = true;
                    } else if (dist < 1.5) { // Tighter tolerance for side hits
                        triggerGameOver();
                        return;
                    }
                }
            }

            // Check Barrels
            for (let i = 0; i < obstacles.length; i++) {
                if (!obstacles[i].active) continue;
                
                const oX = obstacles[i].mesh.position.x;
                const oY = obstacles[i].mesh.position.y;
                const dist = Math.sqrt((pX - oX)**2 + (pY - oY)**2);

                if (dist < 1.5) {
                    triggerGameOver();
                    return;
                }
            }
        }

        function triggerGameOver() {
            gameState = 'GAME_OVER';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('gameOverMenu').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        document.getElementById('startBtn').addEventListener('click', resetGame);
        document.getElementById('restartBtn').addEventListener('click', resetGame);

        // --- MAIN UPDATE LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (delta > 0.1) return; 

            // Animate Loot Coins
            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.position.addScaledVector(c.velocity, delta); 
                c.velocity.y += GRAVITY * delta; 
                c.rotation.y += 10 * delta; 

                if (c.position.y <= GROUND_Y) {
                    c.position.y = GROUND_Y;
                    c.velocity.y *= -0.5; 
                    c.velocity.x *= 0.8; 
                }

                c.life -= delta; 
                if (c.life <= 0) {
                    scene.remove(c);
                    coins.splice(i, 1);
                    score += 50; 
                    document.getElementById('scoreValue').innerText = score;
                }
            }

            // Animate Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.position.addScaledVector(p.velocity, delta); 
                p.life -= delta; 
                p.scale.setScalar(Math.max(0, p.life)); 
                if (p.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            if (gameState === 'PLAYING') {
                if (keys.right) {
                    playerVelX = MOVE_SPEED;
                    if(playerModel) {
                        playerModel.rotation.y = Math.PI / 2;
                        if (!isJumping) playerModel.rotation.z = Math.sin(Date.now() * 0.02) * 0.2; 
                    }
                } else if (keys.left) {
                    if (playerGroup.position.x > camera.position.x - 12) {
                        playerVelX = -MOVE_SPEED;
                        if(playerModel) {
                            playerModel.rotation.y = -Math.PI / 2;
                            if (!isJumping) playerModel.rotation.z = Math.sin(Date.now() * 0.02) * 0.2;
                        }
                    } else {
                        playerVelX = 0;
                    }
                } else {
                    playerVelX = 0;
                    if(playerModel) playerModel.rotation.z = 0; 
                }

                playerGroup.position.x += playerVelX * delta;
                playerVelY += GRAVITY * delta;
                playerGroup.position.y += playerVelY * delta;

                if (playerGroup.position.y <= GROUND_Y) {
                    if (isJumping && playerVelY < -10) {
                        createDustPoof(playerGroup.position.x, GROUND_Y, playerGroup.position.z); 
                    }
                    playerGroup.position.y = GROUND_Y;
                    playerVelY = 0;
                    isJumping = false;
                }

                const targetCameraX = playerGroup.position.x + 6; 
                camera.position.x += (targetCameraX - camera.position.x) * 6 * delta;

                // BUG FIX: Dynamic Light Tracking so shadows never disappear!
                dirLight.position.x = playerGroup.position.x + 5;
                dirLight.target.position.x = playerGroup.position.x;
                dirLight.target.updateMatrixWorld(); // Forces the light to aim properly

                checkCollisions();
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
