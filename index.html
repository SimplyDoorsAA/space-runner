<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Platformer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #87CEEB; /* Bright Sky Blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
        }
        #uiLayer { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 30px;
            color: #ffffff;
            font-size: 40px;
            font-weight: 900;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            display: none;
        }
        .menu { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 50px; 
            border-radius: 20px; 
            border: 5px solid #ffcc00;
            text-align: center; 
            color: #333; 
            pointer-events: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { 
            margin-top: 0; 
            color: #ff3366; 
            font-size: 60px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.1);
        }
        p { font-size: 22px; color: #555; line-height: 1.6; font-weight: bold; }
        .highlight { color: #ff3366; }
        .collect { color: #00cc00; }
        button { 
            background: #ffcc00; 
            color: #333; 
            border: none; 
            padding: 15px 50px; 
            font-size: 28px; 
            border-radius: 50px; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-weight: 900; 
            margin-top: 20px;
            box-shadow: 0 6px 0 #cc9900;
            transition: all 0.1s;
        }
        button:active { 
            transform: translateY(6px);
            box-shadow: 0 0 0 #cc9900;
        }
        #loadingText {
            color: #ff3366;
            font-size: 28px;
            margin-bottom: 20px;
            animation: pulse 1s infinite;
            font-weight: bold;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="hud">SCORE: <span id="scoreValue">0</span></div>

    <div id="uiLayer">
        <div id="startMenu" class="menu">
            <h1>Astro Jump!</h1>
            <div id="loadingText">Loading Models...</div>
            <p>
                <b>Left/Right Arrows</b> to Run.<br>
                <b>Up Arrow</b> to Jump.<br>
            </p>
            <p>Jump on top of <span class="highlight">Aliens</span> to bounce!<br>Jump over the <span class="collect">Barrels</span>.</p>
            <button id="startBtn" style="display: none;">Let's Go!</button>
        </div>

        <div id="gameOverMenu" class="menu hidden">
            <h1 style="color: #ff3366;">OUCH!</h1>
            <p>Final Score: <span id="finalScore" style="color: #ffcc00; font-size: 40px; font-weight: bold; text-shadow: 1px 1px 0 #000;">0</span></p>
            <button id="restartBtn">Play Again</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // --- GAME STATE & CONSTANTS ---
        let gameState = 'LOADING'; 
        let score = 0;
        
        // Physics Constants
        const GRAVITY = -80;
        const JUMP_FORCE = 35;
        const MOVE_SPEED = 15;
        const GROUND_Y = 1.5; // Where the player's feet touch the floor

        // Player State
        let playerVelY = 0;
        let playerVelX = 0;
        let isJumping = false;

        // Path to your GitHub folder
        const PATH = 'SpaceShip%20Images/'; 

        // Inputs
        const keys = { right: false, left: false, up: false };

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Bright Sky Blue
        
        // Give it a slight fog to blend the horizon
        scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

        // 2.5D Camera Setup (Looking at the side)
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 8, 18); // Backed up and looking from the side
        camera.lookAt(0, 4, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        // Bright, cheerful lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); 
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 20);
        scene.add(dirLight);

        // --- ENVIRONMENT ---
        // Solid green ground plane
        const groundGeo = new THREE.BoxGeometry(2000, 10, 10);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x32CD32 }); // Lime Green
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.set(500, -3.5, 0); // Positioned so top is at Y=1.5
        scene.add(ground);

        // Add some background clouds (simple white boxes far back)
        const cloudGeo = new THREE.BoxGeometry(4, 2, 2);
        const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        for(let i=0; i<50; i++) {
            const cloud = new THREE.Mesh(cloudGeo, cloudMat);
            cloud.position.set((Math.random() - 0.2) * 500, 10 + Math.random() * 10, -10 - Math.random() * 10);
            scene.add(cloud);
        }

        // --- ASSET MANAGEMENT ---
        const gltfLoader = new THREE.GLTFLoader();
        let playerModel = null;
        let alienModel = null;
        let barrelModel = null;

        const manager = new THREE.LoadingManager();
        manager.onLoad = function () {
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('startBtn').style.display = 'block';
            gameState = 'MENU';
            buildLevel(); 
        };
        manager.onError = function (url) {
            console.error('Error loading:', url);
            document.getElementById('loadingText').innerText = "File not found! Check spelling in code.";
        };

        gltfLoader.manager = manager;

        // Function to fix dark materials on .glb files
        function fixMaterials(model) {
            model.traverse((child) => {
                if (child.isMesh && child.material) {
                    child.material.metalness = 0.0; 
                    child.material.roughness = 1.0; 
                    child.material.emissive = child.material.color || new THREE.Color(0x000000);
                    child.material.emissiveIntensity = 0.3; // Give it a cartoon glow
                }
            });
        }

        // Load Player
        gltfLoader.load(PATH + 'astronautA.glb', function(gltf) {
            playerModel = gltf.scene;
            fixMaterials(playerModel);
            playerModel.scale.set(3.5, 3.5, 3.5); 
            // Face the player to the right (side-scroller view)
            playerModel.rotation.y = Math.PI / 2; 
        });

        // Load Alien (Enemy)
        gltfLoader.load(PATH + 'alien.glb', function(gltf) {
            alienModel = gltf.scene;
            fixMaterials(alienModel);
            alienModel.scale.set(3, 3, 3); 
            alienModel.rotation.y = -Math.PI / 2; // Face left towards player
        });

        // Load Barrel (Obstacle)
        gltfLoader.load(PATH + 'barrel.glb', function(gltf) {
            barrelModel = gltf.scene;
            fixMaterials(barrelModel);
            barrelModel.scale.set(3, 3, 3); 
        });

        // --- GAME ENTITIES ---
        let playerGroup = new THREE.Group();
        let enemies = [];
        let obstacles = [];
        let particles = [];

        function buildLevel() {
            // Add Player
            if(playerModel) {
                playerGroup.add(playerModel.clone());
            }
            playerGroup.position.set(0, GROUND_Y, 0);
            scene.add(playerGroup);

            generateCourse();
        }

        function generateCourse() {
            // Generate a long track of obstacles and enemies
            let currentX = 20; // Start spawning ahead of player
            
            for(let i=0; i < 100; i++) { // Build 100 chunks
                // Random gap between objects
                currentX += 10 + Math.random() * 15; 

                const rand = Math.random();
                if (rand < 0.5 && alienModel) {
                    // Spawn Alien
                    const alien = alienModel.clone();
                    alien.position.set(currentX, GROUND_Y, 0);
                    scene.add(alien);
                    enemies.push({ mesh: alien, active: true });
                } else if (barrelModel) {
                    // Spawn Barrel
                    const barrel = barrelModel.clone();
                    barrel.position.set(currentX, GROUND_Y, 0);
                    scene.add(barrel);
                    obstacles.push({ mesh: barrel, active: true });
                }
            }
        }

        // --- INPUT HANDLING ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                if (!isJumping && gameState === 'PLAYING') {
                    playerVelY = JUMP_FORCE;
                    isJumping = true;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- EFFECTS ---
        function createPoof(x, y, z, colorHex) {
            // A simple cartoon "poof" particle effect when an enemy is hit
            const particleCount = 10;
            const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            for (let i = 0; i < particleCount; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y + 1, z);
                mesh.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 15,
                    Math.random() * 15 + 5,
                    (Math.random() - 0.5) * 15
                );
                mesh.life = 1.0; 
                scene.add(mesh);
                particles.push(mesh);
            }
        }

        // --- GAME LOGIC ---
        function resetGame() {
            // Clean up old level
            enemies.forEach(e => scene.remove(e.mesh));
            obstacles.forEach(o => scene.remove(o.mesh));
            particles.forEach(p => scene.remove(p));
            enemies = [];
            obstacles = [];
            particles = [];

            // Reset Player
            playerGroup.position.set(0, GROUND_Y, 0);
            playerVelY = 0;
            isJumping = false;
            keys.right = false;
            keys.left = false;
            
            score = 0;
            document.getElementById('scoreValue').innerText = score;

            generateCourse();

            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            document.getElementById('hud').style.display = 'block';

            gameState = 'PLAYING';
        }

        function checkCollisions() {
            const playerBox = new THREE.Box3().setFromObject(playerGroup);
            // Shrink the player hitbox to make the game feel fair and forgiving
            playerBox.expandByScalar(-0.6); 

            // Check Aliens
            for (let i = 0; i < enemies.length; i++) {
                if (!enemies[i].active) continue;
                
                const enemyBox = new THREE.Box3().setFromObject(enemies[i].mesh);
                enemyBox.expandByScalar(-0.4);

                if (playerBox.intersectsBox(enemyBox)) {
                    // MARIO MECHANIC: Are we falling onto the alien?
                    // If player's bottom is above the alien's center, and we are moving down
                    if (playerVelY < 0 && playerGroup.position.y > enemies[i].mesh.position.y + 1) {
                        // SQUASH!
                        enemies[i].active = false;
                        scene.remove(enemies[i].mesh);
                        createPoof(enemies[i].mesh.position.x, enemies[i].mesh.position.y, 0, 0xff3366);
                        
                        // Bounce the player up!
                        playerVelY = JUMP_FORCE * 0.8; 
                        isJumping = true;
                        
                        score += 100;
                        document.getElementById('scoreValue').innerText = score;
                    } else {
                        // Hit from the side - Game Over!
                        triggerGameOver();
                        return;
                    }
                }
            }

            // Check Barrels (Solid Obstacles)
            for (let i = 0; i < obstacles.length; i++) {
                if (!obstacles[i].active) continue;
                
                const barrelBox = new THREE.Box3().setFromObject(obstacles[i].mesh);
                barrelBox.expandByScalar(-0.2);

                if (playerBox.intersectsBox(barrelBox)) {
                    // Block the player from moving forward
                    triggerGameOver();
                    return;
                }
            }
        }

        function triggerGameOver() {
            gameState = 'GAME_OVER';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('gameOverMenu').classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
        }

        document.getElementById('startBtn').addEventListener('click', resetGame);
        document.getElementById('restartBtn').addEventListener('click', resetGame);

        // --- MAIN UPDATE LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Cap delta time to prevent physics explosions if tab is inactive
            if (delta > 0.1) return; 

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.position.addScaledVector(p.velocity, delta); 
                p.velocity.y += GRAVITY * delta; // Particles fall too
                p.life -= delta * 2; 
                p.scale.setScalar(Math.max(0, p.life)); 
                if (p.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            if (gameState === 'PLAYING') {
                // Horizontal Movement
                if (keys.right) {
                    playerVelX = MOVE_SPEED;
                    // Tilt forward slightly when running
                    playerGroup.rotation.z = -0.2;
                    // Face right
                    if(playerModel) playerModel.rotation.y = Math.PI / 2;
                } else if (keys.left) {
                    // Only let them move left if they aren't going backwards past the camera
                    if (playerGroup.position.x > camera.position.x - 10) {
                        playerVelX = -MOVE_SPEED;
                        playerGroup.rotation.z = 0.2;
                        // Face left
                        if(playerModel) playerModel.rotation.y = -Math.PI / 2;
                    } else {
                        playerVelX = 0;
                        playerGroup.rotation.z = 0;
                    }
                } else {
                    playerVelX = 0;
                    playerGroup.rotation.z = 0;
                }

                // Apply Horizontal movement
                playerGroup.position.x += playerVelX * delta;

                // Apply Vertical physics (Gravity)
                playerVelY += GRAVITY * delta;
                playerGroup.position.y += playerVelY * delta;

                // Floor Collision
                if (playerGroup.position.y <= GROUND_Y) {
                    playerGroup.position.y = GROUND_Y;
                    playerVelY = 0;
                    isJumping = false;
                }

                // Camera smoothly follows player's X position, stays looking at them
                const targetCameraX = playerGroup.position.x + 5; // Look slightly ahead
                camera.position.x += (targetCameraX - camera.position.x) * 5 * delta;
                
                // Add points just for moving right!
                if (playerVelX > 0) {
                    score += Math.floor(MOVE_SPEED * delta);
                    document.getElementById('scoreValue').innerText = score;
                }

                checkCollisions();
            }

            // Idle animation for menu
            if (gameState === 'MENU' && playerGroup.position) {
                playerGroup.position.y = GROUND_Y + Math.sin(Date.now() * 0.005) * 0.5;
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
